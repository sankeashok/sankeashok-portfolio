<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.8)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.8)" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f1115" stroke="url(#borderGrad)" stroke-width="2.5" />
  <!-- Text AS -->
  <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="url(#grad)" letter-spacing="-1">AS</text>
  <!-- Cyan Dot -->
  <circle cx="49" cy="40" r="3.5" fill="#38bdf8" />
